<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Writing Word Helper</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: linear-gradient(135deg, #fff7fb, #eef8ff);
    min-height: 100vh;
    color: #26324a;
}

.app {
    max-width: 1400px;
    margin: auto;
    padding: 25px;
}


/* ========================================
   HEADER
======================================== */

.header {
    background: white;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 7px 25px rgba(0,0,0,.08);
    margin-bottom: 20px;
    text-align: center;
}

.title {
    font-size: 36px;
    font-weight: 900;
}

.subtitle {
    margin-top: 8px;
    color: #71809a;
    font-size: 17px;
}

.searchArea {
    margin-top: 20px;
    display: flex;
    justify-content: center;
}

.search {
    width: 100%;
    max-width: 550px;
    padding: 15px 20px;
    border-radius: 18px;
    border: 2px solid #e4e6ee;
    font-size: 17px;
    outline: none;
}

.search:focus {
    border-color: #665cff;
}


/* ========================================
   CATEGORY BUTTONS
======================================== */

.categories {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 22px;
}

.categoryButton {
    border: none;
    padding: 14px 28px;
    border-radius: 18px;
    background: white;
    color: #536078;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.07);
    transition: .2s;
}

.categoryButton:hover {
    transform: translateY(-3px);
}

.categoryButton.active {
    background: #665cff;
    color: white;
}


/* ========================================
   CATEGORY TITLE
======================================== */

.categoryTitle {
    text-align: center;
    margin-bottom: 15px;
}

.categoryTitle h2 {
    margin: 0;
    font-size: 29px;
}

.categoryTitle p {
    margin: 6px 0 0;
    color: #71809a;
}

.wordCount {
    text-align: center;
    color: #8992a5;
    font-size: 14px;
    margin-bottom: 18px;
}


/* ========================================
   FLASH CARDS
======================================== */

.wordGrid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 12px;
}

.wordCard {
    height: 150px;
    perspective: 1000px;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
}

.cardInner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform .6s cubic-bezier(.2,.7,.2,1);
    transform-style: preserve-3d;
}

.wordCard.flipped .cardInner {
    transform: rotateY(180deg);
}

.cardSide {
    position: absolute;
    inset: 0;

    background: white;

    border-radius: 20px;
    border: 3px solid #e7e9f0;

    box-shadow: 0 5px 15px rgba(0,0,0,.07);

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    overflow: hidden;
}

.cardFront {
    background: linear-gradient(145deg,#fff,#f7f7ff);
}

.picture {
    font-size: 55px;
    line-height: 1;
}

.tap {
    margin-top: 12px;
    font-size: 10px;
    color: #9aa1b0;
    font-weight: bold;
}

.cardBack {
    transform: rotateY(180deg);
    background: linear-gradient(145deg,#fff,#f1f0ff);
}

.word {
    font-size: 22px;
    font-weight: 900;
    color: #3c3b75;
    text-align: center;
}

.type {
    margin-top: 7px;
    font-size: 12px;
    color: #8992a5;
    font-weight: bold;
}

.wordCard:hover {
    transform: translateY(-4px);
}

.wordCard:hover .cardSide {
    border-color: #aaa5ff;
    box-shadow: 0 9px 20px rgba(0,0,0,.12);
}


/* ========================================
   NO RESULTS
======================================== */

.noResults {
    text-align: center;
    padding: 50px 20px;
    background: white;
    border-radius: 20px;
    color: #788297;
    font-size: 18px;
}


/* ========================================
   SENTENCE BUILDER
======================================== */

.sentenceBuilder {
    margin-top: 40px;

    background: white;

    border-radius: 30px;

    padding: 30px;

    box-shadow: 0 8px 25px rgba(0,0,0,.09);

    text-align: center;
}

.sentenceHeader {
    margin-bottom: 20px;
}

.sentenceHeader h2 {
    margin: 0;
    font-size: 30px;
}

.sentenceHeader p {
    margin: 7px 0 0;
    color: #71809a;
    font-size: 16px;
}


/* SENTENCE BOX */

.sentenceBox {

    background:
        linear-gradient(
            135deg,
            #f7f5ff,
            #f0faff
        );

    border: 3px dashed #aaa5ff;

    border-radius: 23px;

    padding: 28px 20px;

    min-height: 145px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}

.sentenceLabel {
    font-size: 13px;

    font-weight: 800;

    color: #8992a5;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 12px;
}

.sentencePattern {
    font-size: 30px;

    font-weight: 900;

    color: #3c3b75;

    line-height: 1.4;
}

.sentenceExample {
    margin-top: 12px;

    font-size: 19px;

    color: #667085;

    font-weight: 600;
}


/* ========================================
   SENTENCE WORDS
======================================== */

.sentenceWords {

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 20px;
}

.sentenceWord {

    background: #fff;

    border: 2px solid #e4e6ee;

    border-radius: 14px;

    padding: 10px 16px;

    font-weight: 800;

    color: #536078;
}


/* ========================================
   NEXT SENTENCE BUTTON
======================================== */

.nextSentence {

    margin-top: 22px;

    border: none;

    background: #665cff;

    color: white;

    font-size: 17px;

    font-weight: 900;

    padding: 15px 32px;

    border-radius: 18px;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(102,92,255,.25);

    transition: .2s;
}

.nextSentence:hover {

    transform: translateY(-3px);

    background: #554be8;
}

.nextSentence:active {

    transform: scale(.97);
}


/* ========================================
   RESPONSIVE
======================================== */

@media(max-width:1100px) {

    .wordGrid {
        grid-template-columns: repeat(6,1fr);
    }

}

@media(max-width:850px) {

    .wordGrid {
        grid-template-columns: repeat(5,1fr);
    }

}

@media(max-width:650px) {

    .app {
        padding: 12px;
    }

    .title {
        font-size: 28px;
    }

    .subtitle {
        font-size: 15px;
    }

    .wordGrid {
        grid-template-columns: repeat(4,1fr);
        gap: 8px;
    }

    .wordCard {
        height: 125px;
    }

    .picture {
        font-size: 45px;
    }

    .word {
        font-size: 18px;
    }

    .sentenceBuilder {
        padding: 22px 14px;
    }

    .sentencePattern {
        font-size: 23px;
    }

    .sentenceExample {
        font-size: 17px;
    }

}

@media(max-width:420px) {

    .wordGrid {
        grid-template-columns: repeat(3,1fr);
    }

}


/* ========================================
   REDUCED MOTION
======================================== */

@media(prefers-reduced-motion:reduce) {

    .cardInner {
        transition: none;
    }

    .wordCard {
        transition: none;
    }

}

</style>

        categoryInfo[currentCategory].title;


    categoryDescription.textContent =
        categoryInfo[currentCategory].description;


    wordCount.textContent =
        words.length + " words";


    if (words.length === 0) {

        grid.innerHTML = `

            <div
                class="noResults"
                style="grid-column:1/-1">

                🔍 No words found.

                <br><br>

                Try another word!

            </div>

        `;

        return;
    }


    words.forEach(item => {

        const card =
            document.createElement("button");


        card.type = "button";

        card.className = "wordCard";


        card.innerHTML = `

            <div class="cardInner">


                <div class="cardSide cardFront">

                    <div class="picture">

                        ${item[0]}

                    </div>


                    <div class="tap">

                        CLICK TO SEE THE WORD

                    </div>

                </div>


                <div class="cardSide cardBack">

                    <div class="word">

                        ${item[1]}

                    </div>


                    <div class="type">

                        ${currentCategory.slice(0,-1)}

                    </div>

                </div>


            </div>

        `;


        card.addEventListener(
            "click",
            () => {

                card.classList.toggle(
                    "flipped"
                );

            }
        );


        grid.appendChild(card);

    });

}


/* ========================================
   CATEGORY BUTTONS
======================================== */

document
.querySelectorAll(".categoryButton")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {


            document
            .querySelectorAll(".categoryButton")
            .forEach(b => {

                b.classList.remove(
                    "active"
                );

            });


            button.classList.add(
                "active"
            );


            currentCategory =
                button.dataset.category;


            search.value = "";


            displayWords();

        }
    );

});


/* ========================================
   SEARCH
======================================== */

search.addEventListener(
    "input",
    displayWords
);

    );


/* ========================================
   SHOW SENTENCE
======================================== */

function showSentence() {

    const sentence =
        sentences[sentenceIndex];


    sentencePattern.textContent =
        sentence.pattern;


    sentenceExample.textContent =
        "Example: " +
        sentence.example;


    sentenceWords.innerHTML = "";


    sentence.words.forEach(word => {

        const button =
            document.createElement("div");


        button.className =
            "sentenceWord";


        button.textContent =
            word;


        sentenceWords.appendChild(
            button
        );

    });

}


/* ========================================

    "click",
    () => {

        sentenceIndex++;


        if (
            sentenceIndex >=
            sentences.length
        ) {

            sentenceIndex = 0;

        }


        showSentence();

    }
);
